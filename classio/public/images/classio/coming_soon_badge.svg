<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
    <defs>
        <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0B1A2C" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#05121E" stop-opacity="0.98"/>
        </linearGradient>
        <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#C5A059"/>
            <stop offset="50%" stop-color="#F4E0B9"/>
            <stop offset="100%" stop-color="#C5A059"/>
        </linearGradient>
        <filter id="badgeShadow" x="-10%" y="-15%" width="120%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
        </filter>
    </defs>
    <!-- Background Pill with Shadow -->
    <rect x="4" y="4" width="312" height="72" rx="36" fill="url(#badgeBg)" stroke="url(#goldBorder)" stroke-width="2.5" filter="url(#badgeShadow)"/>
    <rect x="8" y="8" width="304" height="64" rx="32" fill="none" stroke="#D8C3A5" stroke-opacity="0.25" stroke-width="1"/>
    
    <!-- Star Accents -->
    <path d="M42 40L45 32L48 40L56 43L48 46L45 54L42 46L34 43Z" fill="#D8C3A5"/>
    <path d="M278 40L281 32L284 40L292 43L284 46L281 54L278 46L270 43Z" fill="#D8C3A5"/>

    <!-- Main Title -->
    <text x="160" y="38" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="18" font-weight="800" letter-spacing="3" fill="#FFFFFF">COMING SOON</text>
    
    <!-- Subtitle / Action hint -->
    <text x="160" y="58" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#D8C3A5">CLICK TO GET NOTIFIED</text>
</svg>
